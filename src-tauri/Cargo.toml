[package]
name = "rocktier-sign"
version = "0.1.3"
description = "Sign documents on your machine, not someone else's server."
authors = ["Rocktier"]
edition = "2021"

[lib]
name = "rocktier_sign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
# Private keys are stored in the OS secure store (macOS Keychain / Windows
# Credential Manager / libsecret), never as a plaintext file on disk (P0-13).
keyring = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
