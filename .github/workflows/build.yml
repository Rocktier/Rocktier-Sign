name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the built artifacts to this existing release tag (e.g. v1.0.0). Required for manual runs — without it the workflow uploads to the branch name.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  checks:
    name: Tests & Lints
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: npm ci
      - name: Build sign-engine (all targets)
        run: |
          cd sign-engine
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../src-tauri/sign-engine-windows.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../src-tauri/sign-engine-macos .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o ../sign-engine-macos-amd64 .
          cd ..
      - name: Type check
        run: npm run build
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-macos:
    name: macOS (Apple Silicon)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sign-engine (all platforms)
        run: |
          cd sign-engine
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o ../src-tauri/sign-engine-macos .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../src-tauri/sign-engine-windows.exe .
          cd ..
      - name: Install dependencies
        run: npm ci
      - name: Build DMG
        run: npm run tauri build
      - name: Ensure Release Exists
        run: |
          if ! gh release view ${{ inputs.release_tag || github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ inputs.release_tag || github.ref_name }} --draft --title ${{ inputs.release_tag || github.ref_name }} --notes "Automated build for ${{ inputs.release_tag || github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload DMG to Release
        run: |
          uploaded=0
          for i in {1..10}; do
            if gh release upload ${{ inputs.release_tag || github.ref_name }} src-tauri/target/release/bundle/dmg/*.dmg --clobber; then
              uploaded=1
              break
            fi
            echo "  upload attempt $i failed, retrying..."
            sleep 5
          done
          [ "$uploaded" -eq 1 ] || { echo "::error::failed to upload DMG after 10 retries"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows x64 (MSI + MSIX)
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build sign-engine (all platforms)
        run: |
          cd sign-engine
          $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'
          go build -o ../src-tauri/sign-engine-windows.exe .
          $env:GOOS='darwin'; $env:GOARCH='arm64'
          go build -o ../src-tauri/sign-engine-macos .
          cd ..
      - name: Install dependencies
        run: npm ci
      - name: Build MSI + NSIS
        run: npm run tauri build
      - name: Ensure Release Exists
        shell: bash
        run: |
          if ! gh release view ${{ inputs.release_tag || github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ inputs.release_tag || github.ref_name }} --draft --title ${{ inputs.release_tag || github.ref_name }} --notes "Automated build for ${{ inputs.release_tag || github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 去掉 MSI 文件名里的 _en-US（Tauri v2 按 bundle.windows.wix.language 追加）。
      # 应用带语言切换器，文件名宣称单一语言会误导：看起来像存在「英文版」与
      # 其他本地化安装包，而实际只有一个多语言安装包。
      # 只改文件名，不动 bundle 配置 —— WiX 的 language 是 MSI 构建必需的
      # 工具链语言码，改它会让构建失败。
      - name: Strip _en-US from MSI filename
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for f in src-tauri/target/release/bundle/msi/*_en-US.msi; do
            nf="${f%_en-US.msi}.msi"
            mv "$f" "$nf"
            echo "  $(basename "$f") -> $(basename "$nf")"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no *_en-US.msi found - Tauri naming changed, this step needs updating"
            ls -1 src-tauri/target/release/bundle/msi/ 2>/dev/null || true
            exit 1
          fi
          ls -1 src-tauri/target/release/bundle/msi/*.msi

      - name: Upload MSI / NSIS to Release
        shell: bash
        run: |
          uploaded=0
          for i in {1..10}; do
            if gh release upload ${{ inputs.release_tag || github.ref_name }} \
              src-tauri/target/release/bundle/msi/*.msi \
              src-tauri/target/release/bundle/nsis/*.exe --clobber; then
              uploaded=1
              break
            fi
            echo "  upload attempt $i failed, retrying..."
            sleep 5
          done
          [ "$uploaded" -eq 1 ] || { echo "::error::failed to upload MSI/NSIS after 10 retries"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布闸门：两平台都传完之后，先校验资产清单齐全，再把草稿发布为 latest。
  # 不齐就保留草稿并让 job 失败 —— 用户永远不会拿到残缺包。
  # 逻辑统一，仅 REQUIRED_ASSETS 按各产品实际产物定制（见 env）。
  publish:
    name: Verify & Publish Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REQUIRED_ASSETS: '\.dmg$ \.msi$ \.exe$'
    steps:
# 这个 job **必须 checkout**，否则下面的 gh 命令无法工作。
      # 没有 actions/checkout 就没有 git remote，而 gh 靠 git remote 推断
      # 当前仓库 —— 于是每条 gh 命令报
      #   `failed to run git: fatal: not a git repository`
      # 并以非 0 退出。
      #
      # 本 job 只需要读/改 Release 状态、不需要源码，但**为了让 gh 认出
      # 仓库，仍必须 checkout**（build job 都有，只有这里漏了）。
      #
      # 实测踩过：MD v1.0.8 / CAD v0.2.6 / Journal v0.2.8 三仓发版全红，
      # 报错是「六个包全缺」，而资产其实早已上传完毕 —— 真因是这里缺
      # checkout，此前被校验段里的 `2>/dev/null || true` 掩盖着；
      # 去掉那个 `2>/dev/null` 之后它才浮出来。
      #
      # 另一条思路是给每条 gh 命令加 `--repo ${{ github.repository }}`。
      # 选 checkout 是因为它一次解决全部 gh 子命令（view/edit/upload），
      # 而 `--repo` 漏写一处就又坏。
      - uses: actions/checkout@v4
      - name: Verify assets then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Verifying release $TAG"
          # Uploads are done (needs: build jobs); GitHub's asset API can lag
          # minutes before a freshly-uploaded file appears in `gh release view`.
          # Poll up to ~10 min with an initial settle delay before giving up.
          sleep 20
          for i in $(seq 1 30); do
            assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            ok=1
            for pat in $REQUIRED_ASSETS; do
              printf '%s\n' "$assets" | grep -Eq "$pat" || ok=0
            done
            [ "$ok" -eq 1 ] && break
            echo "  waiting for uploads ($(printf '%s\n' "$assets" | grep -c . || true) so far)..."
            sleep 20
          done
          missing=0
          for pat in $REQUIRED_ASSETS; do
            if ! printf '%s\n' "$assets" | grep -Eq "$pat"; then
              echo "::error::release $TAG missing asset matching $pat"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release $TAG is missing required assets — left as DRAFT for manual review"
            exit 1
          fi
          echo "All required assets present; publishing $TAG"
          gh release edit "$TAG" --draft=false --latest
