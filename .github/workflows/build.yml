name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the built artifacts to this existing release tag (e.g. v1.0.0). Required for manual runs — without it the workflow uploads to the branch name.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  checks:
    name: Tests & Lints
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install dependencies
        run: npm ci
      - name: Build sign-engine (all targets)
        run: |
          cd sign-engine
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../src-tauri/sign-engine-windows.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../src-tauri/sign-engine-macos .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o ../sign-engine-macos-amd64 .
          cd ..
      - name: Type check
        run: npm run build
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-macos:
    name: macOS (Apple Silicon)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sign-engine (arm64)
        run: |
          cd sign-engine
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../src-tauri/sign-engine-macos .
          cd ..
      - name: Install dependencies
        run: npm ci
      - name: Build DMG
        run: npm run tauri build
      - name: Ensure Release Exists
        run: |
          if ! gh release view ${{ inputs.release_tag || github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ inputs.release_tag || github.ref_name }} --title ${{ inputs.release_tag || github.ref_name }} --notes "Automated build for ${{ inputs.release_tag || github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload DMG to Release
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} src-tauri/target/release/bundle/dmg/*.dmg --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows x64 (MSI + MSIX)
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build sign-engine (Windows)
        run: |
          cd sign-engine
          $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'
          go build -o ../src-tauri/sign-engine-windows.exe .
          cd ..
      - name: Install dependencies
        run: npm ci
      - name: Build MSI + NSIS
        run: npm run tauri build
      - name: Ensure Release Exists
        shell: bash
        run: |
          if ! gh release view ${{ inputs.release_tag || github.ref_name }} > /dev/null 2>&1; then
            gh release create ${{ inputs.release_tag || github.ref_name }} --title ${{ inputs.release_tag || github.ref_name }} --notes "Automated build for ${{ inputs.release_tag || github.ref_name }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload MSI / NSIS to Release
        shell: bash
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} \
              src-tauri/target/release/bundle/msi/*.msi \
              src-tauri/target/release/bundle/nsis/*.exe --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
